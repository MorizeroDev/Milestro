name: Clang Format

on:
  pull_request:
    branches:
      - master
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: python -m pip install clang-format==23.1.5

      - name: Test Linux runtime compatibility check
        run: python -m unittest discover -s tests -p test_linux_glibc.py

      - name: Check clang-format
        run: |
          git ls-files -z -- '*.h' '*.hh' '*.hpp' '*.c' '*.cc' '*.cpp' '*.cxx' '*.mm' \
            ':!:ext/**' ':!:apps/unity-plugins/Milestro/Plugins/iOS/FrameworkBinding.cpp' \
            | xargs -0 -r clang-format --dry-run --Werror
